      text: Mostly installed and started on servers by hand or with ad-hoc scripts
      risk: red
      rationale: Manual and ad-hoc deployment is slow to repeat, hard to roll back and dependent on individual knowledge.
      mitigation: Adopt a declarative, automated way of deploying and running workloads.
