name: HashiCorp Healthcheck
description: A five-minute, product-neutral healthcheck of how infrastructure is delivered, secured, connected and run. It produces signals for further discussion, not findings.
required: true
sections:
- order: 1
  name: Environment
  questions:
  - order: 1
    text: Where do most of your workloads run today?
    explanation: Choose where the larger share of your production workloads runs. If they are split between your own data centres and public cloud, choose the mix.
    answers:
    - order: 1
      text: Mostly in one public cloud
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'environment: one-cloud'
      - category: Questionnaire Version
        tag: '0.7'
    - order: 2
      text: Across several public clouds
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'environment: several-clouds'
      - category: Questionnaire Version
        tag: '0.7'
    - order: 3
      text: Mostly in our own data centres
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'environment: own-data-centres'
      - category: Questionnaire Version
        tag: '0.7'
    - order: 4
      text: A mix of our own data centres and public cloud
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'environment: hybrid'
      - category: Questionnaire Version
        tag: '0.7'
- order: 2
  name: Infrastructure Delivery
  questions:
  - order: 1
    text: How is most infrastructure provisioned today?
    explanation: Think about how a typical new environment, network or database is created. Choose the answer that describes most of your infrastructure, even if some teams do better.
    answers:
    - order: 1
      text: Through cloud consoles, tickets or other manual steps
      risk: red
      rationale: Delivery depends on manual steps, which slows teams down and makes consistency and governance hard to maintain as the estate grows.
      mitigation: Establish a repeatable infrastructure lifecycle based on declarative automation and reusable delivery patterns.
      applyTags:
      - category: Answer Key
        tag: 'provisioning: manual'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 2
      text: With scripts or automation that each team maintains for itself
      risk: yellow
      rationale: Automation exists, but separate team-maintained approaches can duplicate effort and make consistent controls harder to maintain.
      mitigation: Bring team-specific automation into a common workflow with shared, versioned components.
      applyTags:
      - category: Answer Key
        tag: 'provisioning: team-scripts'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 3
      text: With infrastructure as code, but tools and patterns differ between teams
      risk: yellow
      rationale: Infrastructure is automated, but differing tools and patterns make reuse, governance and movement of people between teams harder to scale.
      mitigation: Converge on common workflows and a shared library of reusable infrastructure patterns.
      applyTags:
      - category: Answer Key
        tag: 'provisioning: fragmented-code'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 4
      text: With infrastructure as code built from shared, reusable patterns
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'provisioning: shared-code'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'provisioning: unknown'
  - order: 2
    text: How are machine images used for servers or compute instances created and maintained?
    explanation: Think about the base images used to launch virtual machines or similar compute. Choose how most of those images are built and updated.
    answers:
    - order: 1
      text: Built or updated by hand, with steps documented in tickets, runbooks or checklists
      risk: red
      rationale: Manual image construction is difficult to reproduce consistently and increases the chance of configuration drift between image versions.
      mitigation: Codify image creation and customisation in a repeatable, version-controlled build workflow.
      applyTags:
      - category: Answer Key
        tag: 'image build: manual'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 2
      text: Automated, but each platform or team maintains a different build process
      risk: yellow
      rationale: Automation exists, but separate build workflows make consistency, reuse and cross-platform governance harder.
      mitigation: Standardise on a common image-build workflow that can produce consistent artefacts across required platforms.
      applyTags:
      - category: Answer Key
        tag: 'image build: fragmented-automation'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 3
      text: Built automatically from version-controlled definitions, but teams maintain their own patterns
      risk: yellow
      rationale: Builds are reproducible, but reusable standards and common image patterns are not yet consistent across the organisation.
      mitigation: Publish and reuse approved image patterns so teams can build from a common baseline.
      applyTags:
      - category: Answer Key
        tag: 'image build: team-patterns'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 4
      text: Built automatically from version-controlled, reusable image definitions
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'image build: codified'
    - order: 5
      text: We do not maintain machine images as part of our delivery model
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'image build: not-applicable'
    - order: 6
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'image build: unknown'
  - order: 3
    text: Once machine images are published, how do teams know which versions are approved and what happens when an image becomes outdated or vulnerable?
    explanation: Consider how image versions are discovered, promoted, tracked and prevented from being reused after a security issue or end-of-life decision.
    answers:
    - order: 1
      text: Teams choose image IDs or versions themselves; there is no central record of approved versions
      risk: red
      rationale: Without a central source of approved image versions, consumers can continue to use outdated or inconsistent artefacts.
      mitigation: Establish a central image registry as the system of record, with metadata and approved versions.
      applyTags:
      - category: Answer Key
        tag: 'image lifecycle: unmanaged-versions'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 2
      text: Approved images are documented centrally, but updates and retirement are communicated and enforced manually
      risk: yellow
      rationale: A standard exists, but lifecycle control depends on people updating references and preventing reuse.
      mitigation: Use explicit promotion channels and lifecycle controls rather than relying on documentation and notification alone.
      applyTags:
      - category: Answer Key
        tag: 'image lifecycle: manual-governance'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 3
      text: Approved versions are published centrally, but downstream consumers are not automatically checked against them
      risk: yellow
      rationale: The system of record exists, but outdated or revoked image use may persist without validation in downstream provisioning.
      mitigation: Integrate image status validation into downstream provisioning and define a revocation process for vulnerable or end-of-life images.
      applyTags:
      - category: Answer Key
        tag: 'image lifecycle: central-no-validation'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 4
      text: Approved versions are published centrally and downstream workflows validate them; outdated or vulnerable images can be revoked
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'image lifecycle: governed'
    - order: 5
      text: We do not maintain machine images as part of our delivery model
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'image lifecycle: not-applicable'
    - order: 6
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'image lifecycle: unknown'
  - order: 4
    text: For a given machine image version in use, could you say what software it contains and what it was built from?
    explanation: Consider whether you could answer a vulnerability or audit question about an image without rebuilding or inspecting it by hand.
    answers:
    - order: 1
      text: No; we would have to inspect a running instance or rebuild it to find out
      risk: red
      rationale: Without a record of an image's contents, a vulnerability or audit question about running systems can be answered only by inspecting or rebuilding them.
      mitigation: Record each image version's contents and the image it was built from at build time, so that questions about running systems can be answered from the record.
      applyTags:
      - category: Answer Key
        tag: 'image composition: unknown-contents'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 2
      text: Partly; build definitions show the steps, but not the resulting package versions or the parent image
      risk: yellow
      rationale: Build steps show what was asked for, not the package versions that resulted or the parent image they were applied to, so the record is incomplete at the point a vulnerability is announced.
      mitigation: Capture the resulting package inventory and parent image with each image version, alongside the build definition.
      applyTags:
      - category: Answer Key
        tag: 'image composition: build-steps-only'
      - category: Capability Signal
        tag: Image Lifecycle
    - order: 3
      text: Yes; each image version records its contents and the image it was built from
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'image composition: recorded'
    - order: 4
      text: We do not maintain machine images as part of our delivery model
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'image composition: not-applicable'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'image composition: unknown'
  - order: 5
    text: How are your organisation's standards and policies applied to new infrastructure?
    explanation: Standards include security rules, cost limits, naming and approved configurations. Choose how they are usually checked when infrastructure is created or changed.
    answers:
    - order: 1
      text: Mostly after deployment, when a problem, audit or review identifies non-compliance
      risk: red
      rationale: Standards checked after deployment allow non-compliant infrastructure to reach production and make remediation expensive.
      mitigation: Express standards as automated checks that run before infrastructure changes are applied.
      applyTags:
      - category: Answer Key
        tag: 'guardrails: after-the-fact'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 2
      text: Each team applies its own checks
      risk: yellow
      rationale: Team-level checks give uneven coverage, so the same standard can be enforced differently, or not at all, from one team to the next.
      mitigation: Define policies once and apply them consistently across every team's delivery workflow.
      applyTags:
      - category: Answer Key
        tag: 'guardrails: per-team'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 3
      text: A central team reviews and approves changes by hand
      risk: yellow
      rationale: Central manual approval provides a control point, but every change depends on reviewer capacity and the process becomes harder to scale as change volume grows.
      mitigation: Automate routine policy checks so that reviewers handle exceptions and teams can self-serve within agreed guardrails.
      applyTags:
      - category: Answer Key
        tag: 'guardrails: central-approval'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 4
      text: Automated checks run on every change, and teams self-serve within them
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'guardrails: automated'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'guardrails: unknown'
  - order: 6
    text: Once infrastructure is built, how are changes made to it?
    explanation: Consider routine changes after the first deployment, such as resizing, patching or reconfiguring. A difference means the running infrastructure no longer matches its definition.
    answers:
    - order: 1
      text: Mostly by hand; records often don't match what is running
      risk: red
      rationale: When changes are made by hand, the recorded configuration stops describing what is running, which makes recovery, audit and further automation unreliable.
      mitigation: Route day-two changes through the same automated workflow used for provisioning, so that the definition stays the source of truth.
      applyTags:
      - category: Answer Key
        tag: 'change and drift: by-hand'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 2
      text: A mix of automation and manual changes; differences surface when something breaks
      risk: yellow
      rationale: Mixing manual and automated change lets differences accumulate unnoticed until they cause an incident.
      mitigation: Detect differences between defined and actual infrastructure continuously, and reduce the routes by which manual change can occur.
      applyTags:
      - category: Answer Key
        tag: 'change and drift: mixed'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 3
      text: Through automation, but differences are found and fixed by hand
      risk: yellow
      rationale: Differences are found, but correcting them by hand is slow and depends on individuals noticing and acting.
      mitigation: Detect differences continuously and route corrective changes through the controlled infrastructure delivery workflow.
      applyTags:
      - category: Answer Key
        tag: 'change and drift: fixed-by-hand'
      - category: Capability Signal
        tag: Infrastructure Lifecycle
    - order: 4
      text: Through the same controlled workflow that built it; differences are detected and corrective changes are made through that workflow
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'change and drift: reconciled'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'change and drift: unknown'
- order: 3
  name: Security and Access
  questions:
  - order: 1
    text: How do applications typically obtain credentials such as database passwords or API keys?
    explanation: Think about how a typical application gets a database password, API key or token when it starts or while it runs.
    answers:
    - order: 1
      text: From configuration files, source code or settings maintained by hand
      risk: red
      rationale: Credentials kept in files, code or hand-maintained settings are easy to copy and hard to track, so exposure can go unnoticed and revocation is difficult.
      mitigation: Move credentials out of code and configuration into centrally managed storage with access control and audit.
      applyTags:
      - category: Answer Key
        tag: 'secret storage: in-files'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 2
      text: From several secret stores, depending on the platform or team
      risk: yellow
      rationale: Several stores mean several sets of access rules, audit trails and rotation practices, which makes consistent control difficult.
      mitigation: Consolidate towards a common approach to secrets, with consistent access policy and audit across platforms.
      applyTags:
      - category: Answer Key
        tag: 'secret storage: several-stores'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 3
      text: From one central secrets store
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'secret storage: central-store'
    - order: 4
      text: They are issued automatically, based on the application's own identity
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'secret storage: identity-issued'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'secret storage: unknown'
  - order: 2
    text: How does an application prove its identity when it connects to the systems it depends on?
    explanation: Think about how a service, job or virtual machine authenticates to a database, a secrets store or another service. Choose how most of your workloads do it.
    answers:
    - order: 1
      text: With a credential placed in its configuration or environment at deployment and left in place
      risk: red
      rationale: A credential placed at deployment and left in place is a standing credential. If it is exposed, it remains usable until it is changed or revoked.
      mitigation: Give workloads an identity assigned automatically by their platform, runtime or a workload identity system, used directly or exchanged for short-lived credentials where needed.
      applyTags:
      - category: Answer Key
        tag: 'workload identity: static-credential'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 2
      text: With an account of its own, such as a service account with a password or key that is managed by hand
      risk: yellow
      rationale: A hand-managed service account credential has to be distributed, protected and rotated by hand, like any other secret.
      mitigation: Replace hand-managed service account credentials with an identity assigned automatically by the platform, runtime or a workload identity system, so that no long-lived credential needs distributing.
      applyTags:
      - category: Answer Key
        tag: 'workload identity: service-account'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 3
      text: With an automatically assigned identity for some workloads, and static credentials for the rest
      risk: yellow
      rationale: Two identity models mean two sets of controls to govern, and the workloads still on static credentials carry the exposure those credentials bring.
      mitigation: Extend automatically assigned identity to the remaining workloads, prioritising those whose static credentials reach the most sensitive systems.
      applyTags:
      - category: Answer Key
        tag: 'workload identity: partly-platform'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 4
      text: With a verifiable identity assigned automatically by its platform, runtime or a workload identity system, and no long-lived credential distributed at deployment
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'workload identity: platform-issued'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'workload identity: unknown'
  - order: 3
    text: How long do application credentials usually stay valid?
    explanation: Consider the credentials applications use to reach databases, queues and other services. Choose what happens for most of them.
    answers:
    - order: 1
      text: Until someone changes them by hand; they are rarely rotated
      risk: red
      rationale: Credentials that are rarely changed remain useful to anyone who obtains them, and rotating them by hand is disruptive enough that it tends to be postponed.
      mitigation: Automate rotation, and move towards credentials that are issued on demand with a short lifetime.
      applyTags:
      - category: Answer Key
        tag: 'rotation: rarely'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 2
      text: They are rotated on a schedule, mostly by a manual process
      risk: yellow
      rationale: Manual rotation on a schedule is labour-intensive and error-prone, and credentials remain valid for the whole interval between rotations.
      mitigation: Automate the rotation process and shorten credential lifetimes where applications can support it.
      applyTags:
      - category: Answer Key
        tag: 'rotation: manual-schedule'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 3
      text: They are rotated automatically on a schedule
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'rotation: automatic'
    - order: 4
      text: They are short-lived and issued on demand
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'rotation: short-lived'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'rotation: unknown'
  - order: 4
    text: How are certificates for internal services issued and renewed?
    explanation: Internal services are those reached only from inside your organisation. Consider the certificates they use to identify themselves and to encrypt traffic.
    answers:
    - order: 1
      text: Requested and renewed by hand; expiries have caused outages
      risk: red
      rationale: Manual certificate handling makes expiry an operational risk and discourages short certificate lifetimes.
      mitigation: Automate certificate issuance and renewal from a managed internal certificate authority.
      applyTags:
      - category: Answer Key
        tag: 'certificates: by-hand'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 2
      text: Partly automated; it varies by team or platform
      risk: yellow
      rationale: Uneven automation leaves some services dependent on manual renewal, preserving certificate-expiry risk for those services.
      mitigation: Extend automated issuance and renewal to all teams and platforms through a common service.
      applyTags:
      - category: Answer Key
        tag: 'certificates: partly-automated'
      - category: Capability Signal
        tag: Machine Identity and Secrets
    - order: 3
      text: Issued and renewed automatically for most services
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'certificates: automated'
    - order: 4
      text: Certificates are not commonly used for internal services
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'certificates: not-used'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'certificates: unknown'
  - order: 5
    text: How do engineers connect to servers, databases and clusters to administer them?
    explanation: Consider the network route an engineer takes to reach a production system for maintenance or troubleshooting.
    answers:
    - order: 1
      text: Directly from the corporate network, with nothing in between
      risk: red
      rationale: Direct administrative access relies heavily on network controls and makes central authorisation per user and per system harder to enforce consistently.
      mitigation: Place an identity-aware access layer in front of administrative interfaces so that connections are authorised per system.
      applyTags:
      - category: Answer Key
        tag: 'access path: direct'
      - category: Capability Signal
        tag: Human Access
    - order: 2
      text: Through a VPN that gives broad network access once connected
      risk: yellow
      rationale: A broad VPN grants reachability at network scope rather than per system, which makes least-privilege access harder to express and enforce consistently.
      mitigation: Move from network-level access to access granted per system on the basis of identity and role.
      applyTags:
      - category: Answer Key
        tag: 'access path: vpn'
      - category: Capability Signal
        tag: Human Access
    - order: 3
      text: Through bastion or jump hosts managed separately per environment
      risk: yellow
      rationale: Jump hosts managed separately in each environment multiply the access rules, keys and audit trails that must be maintained.
      mitigation: Consolidate access through a common, centrally governed service with consistent policy across environments.
      applyTags:
      - category: Answer Key
        tag: 'access path: bastion'
      - category: Capability Signal
        tag: Human Access
    - order: 4
      text: Through an access service that connects them only to the systems they are approved for
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'access path: brokered'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'access path: unknown'
  - order: 6
    text: What credentials are used to get into the systems engineers administer?
    explanation: Consider the account, key or password presented to the server, database or cluster itself, however the engineer reached it.
    answers:
    - order: 1
      text: Shared accounts, keys or passwords
      risk: red
      rationale: A shared credential does not identify the individual using it, so attribution depends on separate access records. Shared credentials are also harder to rotate and withdraw safely.
      mitigation: Replace shared credentials with access tied to individual identity, and issue the underlying credentials centrally so that they can be rotated.
      applyTags:
      - category: Answer Key
        tag: 'access credentials: shared'
      - category: Capability Signal
        tag: Human Access
      - category: Adjacent Capability Signal
        tag: Machine Identity and Secrets
    - order: 2
      text: Personal keys or passwords that each engineer manages and that rarely expire
      risk: yellow
      rationale: Long-lived personal credentials rely on each engineer to protect them and must be explicitly retired when access requirements or roles change.
      mitigation: Tie access to the engineer's organisational identity, with credentials that are time-limited and issued when needed.
      applyTags:
      - category: Answer Key
        tag: 'access credentials: personal-long-lived'
      - category: Capability Signal
        tag: Human Access
    - order: 3
      text: Their single sign-on identity, with access granted by role
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'access credentials: single-sign-on'
    - order: 4
      text: Credentials issued or injected for the session that expire automatically; engineers may never see them
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'access credentials: per-session'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'access credentials: unknown'
  - order: 7
    text: Could you show who accessed a given production system last week, and what they did?
    explanation: 'Think of an audit request or an incident investigation: could you produce a record of who connected, and of what they did during the session?'
    answers:
    - order: 1
      text: No, or only by piecing together logs from several places
      risk: red
      rationale: Without a single record of access, investigating an incident or answering an audit request is slow and may be incomplete.
      mitigation: Route administrative access through a point that records who connected to what, and when.
      applyTags:
      - category: Answer Key
        tag: 'visibility: none'
      - category: Capability Signal
        tag: Human Access
    - order: 2
      text: Who connected, yes; what they did, no
      risk: yellow
      rationale: Knowing who connected, but not what was done, limits the ability to investigate incidents and to demonstrate control over privileged activity.
      mitigation: Add session-level logging or recording for access to sensitive systems.
      applyTags:
      - category: Answer Key
        tag: 'visibility: who-only'
      - category: Capability Signal
        tag: Human Access
    - order: 3
      text: Yes; session activity is centrally logged or recorded
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'visibility: recorded'
    - order: 4
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'visibility: unknown'
- order: 4
  name: Runtime and Connectivity
  questions:
  - order: 1
    text: How do applications find each other across your environments?
    explanation: Consider how one application learns the address of another that it depends on, especially when the two run in different environments or on different platforms.
    answers:
    - order: 1
      text: Fixed addresses or host files maintained by hand
      risk: red
      rationale: Hand-maintained addresses require coordinated updates when services move or scale, making service location dependent on manual configuration.
      mitigation: Introduce a service registry so that applications locate each other by name, with health-aware records that update automatically.
      applyTags:
      - category: Answer Key
        tag: 'discovery: fixed-addresses'
      - category: Capability Signal
        tag: Service Networking
    - order: 2
      text: A different mechanism in each environment
      risk: yellow
      rationale: Separate discovery mechanisms create different service-location models between environments and make cross-environment dependencies harder to manage consistently where they exist.
      mitigation: Provide a common discovery mechanism that spans environments and platforms.
      applyTags:
      - category: Answer Key
        tag: 'discovery: per-environment'
      - category: Capability Signal
        tag: Service Networking
    - order: 3
      text: Everything runs on one platform and its built-in discovery is enough
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'discovery: one-platform'
    - order: 4
      text: One discovery layer spans all environments
      risk: green
      applyTags:
      - category: Answer Key
        tag: 'discovery: spanning-layer'
    - order: 5
      text: I don't know
      risk: unknown
      applyTags:
      - category: Answer Key
        tag: 'discovery: unknown'
  - order: 2
    text: How is traffic between applications controlled?
    explanation: Consider what decides whether one application is allowed to call another, and whether that traffic is encrypted.
    answers:
    - order: 1
      text: Mostly by network location; once inside, services can reach each other freely
      risk: red
      rationale: Where network location is the primary control, services inside that perimeter can reach one another without explicit per-service authorisation.
      mitigation: Authorise service-to-service traffic explicitly, on the basis of service identity rather than network position.
      applyTags:
      - category: Answer Key
        tag: 'service-to-service security: network-location'
      - category: Capability Signal
        tag: Service Networking
    - order: 2
      text: Firewall rules or address lists updated by ticket or by hand
      risk: yellow
      rationale: Address-based rules require manual updates as services change, creating operational delay and a risk that obsolete rules remain in place.
      mitigation: Define which services may communicate in terms of service identity, and apply those rules automatically as services change.
      applyTags:
      - category: Answer Key
        tag: 'service-to-service security: manual-rules'
      - category: Capability Signal
        tag: Service Networking
    - order: 3
