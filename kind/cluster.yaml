kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    # Loopback only: the default binds every address this machine has, which publishes
    # the environment to the network it is on.
    extraPortMappings:
      - containerPort: 443
        hostPort: 8443
        listenAddress: 127.0.0.1
