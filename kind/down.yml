- name: Remove the kind cluster and the local images
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cluster: healthcheck
    images:
      - healthcheck-console
      - healthcheck-readout
    # podman or docker. Empty takes the first of the two that answers.
    engine: ""
  environment:
    KIND_EXPERIMENTAL_PROVIDER: "{{ engine }}"
  tasks:
    - name: Look for a container engine
      ansible.builtin.command: "{{ item }} info"
      loop: "{{ [engine] if engine else ['podman', 'docker'] }}"
      register: engines
      changed_when: false
      failed_when: false

    - name: Note the engines that answer
      ansible.builtin.set_fact:
        answering: "{{ engines.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | map(attribute='item') }}"

    - name: Choose the container engine
      ansible.builtin.set_fact:
        engine: "{{ answering | first | default('') }}"
      when: not engine

    - name: Require a container engine
      ansible.builtin.assert:
        that: engine in answering
        fail_msg: No container engine answers. Start podman or docker, or name one with -e engine=podman or -e engine=docker.

    - name: Delete the kind cluster
      ansible.builtin.command: kind delete cluster --name {{ cluster }}

    - name: Remove the kubeconfig
      ansible.builtin.file:
        path: "{{ playbook_dir }}/kubeconfig"
        state: absent

    - name: Remove the local images with the engine
      ansible.builtin.include_tasks: "{{ engine }}/remove.yml"
