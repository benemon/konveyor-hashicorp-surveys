- name: Remove the kind cluster and the local images
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cluster: healthcheck
  environment:
    KIND_EXPERIMENTAL_PROVIDER: podman
  tasks:
    - name: Delete the kind cluster
      ansible.builtin.command: kind delete cluster --name {{ cluster }}

    - name: Remove the kubeconfig
      ansible.builtin.file:
        path: "{{ playbook_dir }}/kubeconfig"
        state: absent

    - name: Remove the local images
      containers.podman.podman_image:
        name: "localhost/{{ item }}"
        state: absent
      loop:
        - healthcheck-console
        - healthcheck-readout
