{{- if .Capabilities.APIVersions.Has "build.openshift.io/v1" }}
{{- range $name := list "snapshot-console" "snapshot-readout" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-source
data:
  {{- range $file, $_ := $.Files.Glob (printf "%s/*.*" $name) }}
  {{ base $file }}: {{ $.Files.Get $file | quote }}
  {{- end }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ $name }}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ $name }}
spec:
  source:
    dockerfile: {{ $.Files.Get (printf "%s/Containerfile" $name) | quote }}
    configMaps:
      - configMap:
          name: {{ $name }}-source
        destinationDir: .
  strategy:
    dockerStrategy:
      from:
        kind: DockerImage
        name: {{ $.Values.pythonImage }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $name }}:latest
{{- end }}
---
# The operator's egress policy stops build pods reaching the internal registry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hashicorp-snapshot-build
spec:
  podSelector:
    matchExpressions:
      - key: openshift.io/build.name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - port: 5000
{{- end }}
