apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: snapshot-readout
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: snapshot-readout
spec:
  source:
    type: Binary
  strategy:
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: python:3.12-ubi9
  output:
    to:
      kind: ImageStreamTag
      name: snapshot-readout:latest
---
apiVersion: tackle.konveyor.io/v1alpha1
kind: Addon
metadata:
  name: snapshot-readout
spec:
  container:
    name: addon
    image: image-registry.openshift-image-registry.svc:5000/openshift-mta/snapshot-readout:latest
    # The hub defaults this to IfNotPresent, which would keep running a stale :latest image.
    imagePullPolicy: Always
---
# The MTA operator's egress policy stops build pods reaching the internal registry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snapshot-readout-build
spec:
  podSelector:
    matchExpressions:
      - key: openshift.io/build.name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - port: 5000
