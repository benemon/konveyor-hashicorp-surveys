apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: survey-bootstrap
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: survey-bootstrap
spec:
  source:
    type: Binary
  strategy:
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: python:3.12-ubi9
  output:
    to:
      kind: ImageStreamTag
      name: survey-bootstrap:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey-bootstrap
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"survey-bootstrap:latest"},
      "fieldPath":"spec.template.spec.containers[?(@.name==\"survey-bootstrap\")].image"}]
spec:
  selector:
    matchLabels:
      app: survey-bootstrap
  template:
    metadata:
      labels:
        app: survey-bootstrap
    spec:
      containers:
        - name: survey-bootstrap
          image: image-registry.openshift-image-registry.svc:5000/openshift-mta/survey-bootstrap:latest
          env:
            - name: MTA_HUB
              value: http://mta-hub:8080
            - name: MTA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: survey-bootstrap
                  key: api-key
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /bootstrap/
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: survey-bootstrap
spec:
  selector:
    app: survey-bootstrap
  ports:
    - port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: survey-bootstrap
spec:
  # MTA's own host, so that the page shares the browser tab's MTA session.
  host: mta.example.com
  path: /bootstrap
  to:
    kind: Service
    name: survey-bootstrap
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# The MTA operator denies ingress to every pod in the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: survey-bootstrap
spec:
  podSelector:
    matchLabels:
      app: survey-bootstrap
  ingress:
    - ports:
        - port: 8080
---
# The MTA operator's egress policy stops build pods reaching the internal registry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: survey-bootstrap-build
spec:
  podSelector:
    matchExpressions:
      - key: openshift.io/build.name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - port: 5000
